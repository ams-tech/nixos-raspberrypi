name: CI

on:
  push:
    branches:
      - main
      - develop
      - rpi-otp-private-key
      - topic/rpi-otp-private-key

  pull_request:
    branches:
      - kaiba
      - main
      - develop
      - rpi-otp-private-key

  workflow_dispatch:

jobs:
  format:
    name: Check formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: ./.github/actions/setup-nix-action

      - name: Run formatter
        run: nix fmt . -- --ci
      - name: Check IPv4 TCP options lifetime backport
        run: nix build --no-link -L .#checks.x86_64-linux.ipv4-tcp-options-rcu
